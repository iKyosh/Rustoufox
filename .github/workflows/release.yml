name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # Link against glibc 2.28 (Debian 10, RHEL 8) rather than the runner's.
            glibc: "2.28"
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - name: Build
        if: ${{ !matrix.glibc }}
        run: cargo build --release --locked --bin rustoufox --target ${{ matrix.target }}
      - name: Build against an older glibc
        if: ${{ matrix.glibc }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zig" && "$RUNNER_TEMP/zig/bin/pip" install ziglang==0.17.0
          export PATH="$RUNNER_TEMP/zig/bin:$PATH"
          cargo install cargo-zigbuild@0.23.4 --locked
          cargo zigbuild --release --locked --bin rustoufox --target ${{ matrix.target }}.${{ matrix.glibc }}
      - name: Package
        shell: bash
        run: |
          name="rustoufox-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md "$name/"
          cp target/${{ matrix.target }}/release/rustoufox "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # Only the archives: the staging directory's name also contains dots.
          path: rustoufox-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "rustoufox $version" --notes-file notes.md --verify-tag "${flags[@]}"
